suite: ingress
templates:
  - templates/ingress.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: should create only an IngressRoute in wildcard mode (default)
    asserts:
      - hasDocuments:
          count: 1

  - it: should create an IngressRoute
    documentIndex: 0
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: apiVersion
          value: traefik.io/v1alpha1

  - it: should set the correct host match rule
    documentIndex: 0
    asserts:
      - equal:
          path: spec.routes[0].match
          value: "Host(`test-release.k3s.internal.example.com`)"

  - it: should use websecure entrypoint
    documentIndex: 0
    asserts:
      - contains:
          path: spec.entryPoints
          content: websecure

  - it: should reference the https-redirectscheme middleware
    documentIndex: 0
    asserts:
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: https-redirectscheme
            namespace: traefik

  - it: should not set a TLS secretName in wildcard mode
    documentIndex: 0
    asserts:
      - equal:
          path: spec.tls
          value: {}

  - it: should set external-dns annotation
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]
          value: k3s.internal.example.com

  - it: should set homepage annotations
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["gethomepage.dev/enabled"]
          value: "true"
      - equal:
          path: metadata.annotations["gethomepage.dev/group"]
          value: services
      - equal:
          path: metadata.annotations["gethomepage.dev/icon"]
          value: test-release.png
      - equal:
          path: metadata.annotations["gethomepage.dev/name"]
          value: test-release

  - it: should add extra middlewares to the default route
    documentIndex: 0
    set:
      ingress.defaultRoute.extraMiddlewares:
        - name: keycloak-openid
          namespace: traefik
    asserts:
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: https-redirectscheme
            namespace: traefik
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: keycloak-openid
            namespace: traefik

  - it: should not create ingress when disabled
    set:
      ingress.create: false
    asserts:
      - hasDocuments:
          count: 0

  # extraIngressRoutes — dual exposure: a separate IngressRoute object per entry (not bundled
  # into the default route's), since each Traefik instance's labelSelector scopes per-object.
  - it: should render a separate IngressRoute per extraIngressRoutes entry
    documentIndex: 1
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: metadata.name
          value: test-release-external
      - equal:
          path: metadata.labels.exposure
          value: external
      - equal:
          path: spec.routes[0].match
          value: "Host(`test-release.k3s.example.com`)"

  - it: should render two documents total for one extraIngressRoutes entry
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
    asserts:
      - hasDocuments:
          count: 2

  - it: should not set a TLS secretName on an extraIngressRoutes entry with no certificateHostname
    documentIndex: 1
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
    asserts:
      - equal:
          path: spec.tls
          value: {}

  - it: should render extra route middlewares when set
    documentIndex: 1
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          middlewares:
            - name: keycloak-openid
              namespace: traefik
    asserts:
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: keycloak-openid
            namespace: traefik

  - it: should not touch the default IngressRoute's tls when an unrelated extraIngressRoutes entry needs its own cert
    documentIndex: 0
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          certificateHostname: "test-release.k3s.example.com"
    asserts:
      - equal:
          path: spec.tls
          value: {}

  - it: should set tls.secretName on an extraIngressRoutes entry that declares certificateHostname
    documentIndex: 1
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          certificateHostname: "test-release.k3s.example.com"
    asserts:
      - equal:
          path: spec.tls.secretName
          value: test-release-cert

  - it: should create a shared Certificate scoped to just the extra hostname
    documentIndex: 2
    set:
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          certificateHostname: "test-release.k3s.example.com"
    asserts:
      - isKind:
          of: Certificate
      - contains:
          path: spec.dnsNames
          content: test-release.k3s.example.com
      - notContains:
          path: spec.dnsNames
          content: test-release.k3s.internal.example.com

  # perHost mode — pre-wildcard-cert behavior, kept as an explicit override
  - it: should create an IngressRoute and Certificate in perHost mode
    set:
      ingress.tls.mode: perHost
    asserts:
      - hasDocuments:
          count: 2

  - it: should set the TLS cert secret in perHost mode
    documentIndex: 0
    set:
      ingress.tls.mode: perHost
    asserts:
      - equal:
          path: spec.tls.secretName
          value: test-release-cert

  - it: should create a Certificate in perHost mode
    documentIndex: 1
    set:
      ingress.tls.mode: perHost
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: apiVersion
          value: cert-manager.io/v1

  - it: should set the correct issuer in perHost mode
    documentIndex: 1
    set:
      ingress.tls.mode: perHost
    asserts:
      - equal:
          path: spec.issuerRef
          value:
            name: letsencrypt-staging-issuer
            kind: ClusterIssuer

  - it: should set the correct DNS name on the certificate in perHost mode
    documentIndex: 1
    set:
      ingress.tls.mode: perHost
    asserts:
      - contains:
          path: spec.dnsNames
          content: test-release.k3s.internal.example.com

  - it: should include extraIngressRoutes hostnames on the certificate in perHost mode
    documentIndex: 2
    set:
      ingress.tls.mode: perHost
      extraIngressRoutes:
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          certificateHostname: "test-release.k3s.example.com"
    asserts:
      - contains:
          path: spec.dnsNames
          content: test-release.k3s.internal.example.com
      - contains:
          path: spec.dnsNames
          content: test-release.k3s.example.com
