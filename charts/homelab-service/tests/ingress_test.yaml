suite: ingress
templates:
  - templates/ingress.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: should create only an IngressRoute in wildcard mode (default)
    asserts:
      - hasDocuments:
          count: 1

  - it: should create an IngressRoute
    documentIndex: 0
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: apiVersion
          value: traefik.io/v1alpha1

  - it: should set the correct host match rule
    documentIndex: 0
    asserts:
      - equal:
          path: spec.routes[0].match
          value: "Host(`test-release.k3s.internal.example.com`)"

  - it: should use websecure entrypoint
    documentIndex: 0
    asserts:
      - contains:
          path: spec.entryPoints
          content: websecure

  - it: should reference the https-redirectscheme middleware
    documentIndex: 0
    asserts:
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: https-redirectscheme
            namespace: traefik

  - it: should not set a TLS secretName in wildcard mode
    documentIndex: 0
    asserts:
      - equal:
          path: spec.tls
          value: {}

  - it: should set a TLS secretName in perHost mode
    documentIndex: 0
    set:
      certificate.tls.mode: perHost
    asserts:
      - equal:
          path: spec.tls.secretName
          value: test-release-cert

  - it: should set external-dns annotation
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]
          value: k3s.internal.example.com

  - it: should set homepage annotations
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["gethomepage.dev/enabled"]
          value: "true"
      - equal:
          path: metadata.annotations["gethomepage.dev/group"]
          value: services
      - equal:
          path: metadata.annotations["gethomepage.dev/icon"]
          value: test-release.png
      - equal:
          path: metadata.annotations["gethomepage.dev/name"]
          value: test-release

  - it: should not set the external-dns annotation when not requested on the route
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
          middlewares:
            - name: https-redirectscheme
              namespace: traefik
    documentIndex: 0
    asserts:
      - notExists:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]

  - it: should not set homepage annotations when not requested on the route
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
          externalDns:
            enabled: true
    documentIndex: 0
    asserts:
      - notExists:
          path: metadata.annotations["gethomepage.dev/enabled"]

  - it: should add extra middlewares to a route by listing them alongside https-redirectscheme
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
          middlewares:
            - name: https-redirectscheme
              namespace: traefik
            - name: keycloak-openid
              namespace: traefik
    documentIndex: 0
    asserts:
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: https-redirectscheme
            namespace: traefik
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: keycloak-openid
            namespace: traefik

  - it: should not create ingress when the route list is empty
    set:
      ingressRoutes: []
    asserts:
      - hasDocuments:
          count: 0

  - it: should default the backend to this release's own Service
    documentIndex: 0
    asserts:
      - equal:
          path: spec.routes[0].services[0]
          value:
            kind: Service
            name: test-release
            namespace: default
            passHostHeader: true
            port: 80

  - it: should render only one route when only one entry is given with no homepage/external-dns
    set:
      ingressRoutes:
        - name: it-tools
          match: "Host(`it-tools.example.com`)"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: IngressRoute
      - equal:
          path: metadata.name
          value: it-tools

  - it: should point a route at an external backendService
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
          backendService:
            name: some-other-service
            namespace: some-other-namespace
            port: 443
            scheme: https
            serversTransport: some-other-service
    documentIndex: 0
    asserts:
      - equal:
          path: spec.routes[0].services[0]
          value:
            kind: Service
            name: some-other-service
            namespace: some-other-namespace
            passHostHeader: true
            port: 443
            scheme: https
            serversTransport: some-other-service

  - it: should point a second route at an external backendService
    documentIndex: 1
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: it-tools
          match: "Host(`it-tools.example.com`)"
          backendService:
            name: gsw130-k3s1-origin
            namespace: egress
            port: 443
            scheme: https
            serversTransport: gsw130-k3s1-origin
    asserts:
      - equal:
          path: spec.routes[0].services[0]
          value:
            kind: Service
            name: gsw130-k3s1-origin
            namespace: egress
            passHostHeader: true
            port: 443
            scheme: https
            serversTransport: gsw130-k3s1-origin

  # dual exposure — a separate IngressRoute object per entry (not bundled into one), since each
  # Traefik instance's labelSelector scopes per-object.
  - it: should render a separate IngressRoute per extra route entry
    documentIndex: 1
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: metadata.name
          value: test-release-external
      - equal:
          path: metadata.labels.exposure
          value: external
      - equal:
          path: spec.routes[0].match
          value: "Host(`test-release.k3s.example.com`)"

  - it: should render two documents total for two route entries
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
    asserts:
      - hasDocuments:
          count: 2

  - it: should not set a TLS secretName on an extra route with no certificateHostname
    documentIndex: 1
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
    asserts:
      - equal:
          path: spec.tls
          value: {}

  - it: should render extra route middlewares when set
    documentIndex: 1
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          middlewares:
            - name: keycloak-openid
              namespace: traefik
    asserts:
      - contains:
          path: spec.routes[0].middlewares
          content:
            name: keycloak-openid
            namespace: traefik

  - it: should not touch the default IngressRoute's tls when an unrelated extra route needs its own cert
    documentIndex: 0
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          certificateHostname: "test-release.k3s.example.com"
    asserts:
      - equal:
          path: spec.tls
          value: {}

  - it: should set tls.secretName on an extra route that declares certificateHostname
    documentIndex: 1
    set:
      ingressRoutes:
        - name: "{{ include \"service.name\" . }}"
          match: "Host(`{{ include \"service.name\" . }}.{{ include \"cluster.fqdn\" . }}`)"
        - name: "{{ include \"service.name\" . }}-external"
          labels:
            exposure: external
          match: "Host(`test-release.k3s.example.com`)"
          certificateHostname: "test-release.k3s.example.com"
    asserts:
      - equal:
          path: spec.tls.secretName
          value: test-release-cert
