suite: secrets
templates:
  - templates/secrets.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: should create an ExternalSecret
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1

  - it: should set the release name as metadata name
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: should reference the vault-backend ClusterSecretStore
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            name: vault-backend
            kind: ClusterSecretStore

  - it: should set the correct vault path
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: software/k3s/test-release

  - it: should set target name and creation policy
    asserts:
      - equal:
          path: spec.target
          value:
            name: test-release
            creationPolicy: Owner

  - it: should set refresh interval to 300s
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 300s
