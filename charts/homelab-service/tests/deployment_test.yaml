suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: should create a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: apiVersion
          value: apps/v1

  - it: should set the release name as metadata name
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: should use Recreate strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should set replicas to 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should set progressDeadlineSeconds to 600
    asserts:
      - equal:
          path: spec.progressDeadlineSeconds
          value: 600

  - it: should set revisionHistoryLimit to 2
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 2

  - it: should use the default container image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/org/repo:tag"

  - it: should set imagePullPolicy to IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should expose port 8080 named http
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP

  - it: should set resource limits and requests
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

  - it: should mount config volume
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /config
            name: config

  - it: should set default env variables
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUID
            value: "5000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGID
            value: "5000"

  - it: should configure liveness and readiness probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /
              port: http
            periodSeconds: 60
            failureThreshold: 5
            timeoutSeconds: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 5

  - it: should reference the config PVC in volumes
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            persistentVolumeClaim:
              claimName: config

  - it: should include standard labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: test-release
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test-release
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should not set securityContext by default
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: should set securityContext when specified
    set:
      deployment.securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

  - it: should not set container securityContext by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: should set container securityContext when specified
    set:
      deployment.container.securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        privileged: false
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            privileged: false
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

  - it: should not set lifecycle by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: should set lifecycle when specified
    set:
      deployment.container.lifecycle:
        postStart:
          exec:
            command: ["sh", "-c", "echo hello"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle
          value:
            postStart:
              exec:
                command: ["sh", "-c", "echo hello"]

  - it: should not create deployment when disabled
    set:
      deployment.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not add any sidecar container by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - notExists:
          path: spec.template.spec.initContainers

  - it: should add a classic sidecar (native false/omitted) as a second entry in containers
    set:
      deployment.sidecars:
        - name: helper
          image: busybox
          ports:
            - name: monitoring
              containerPort: 9707
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: helper
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 9707
      - notExists:
          path: spec.template.spec.containers[1].restartPolicy
      - notExists:
          path: spec.template.spec.initContainers

  - it: should add a native sidecar (native true) to initContainers with restartPolicy Always, not to containers
    set:
      deployment.sidecars:
        - name: helper
          native: true
          image: busybox
          ports:
            - name: monitoring
              containerPort: 9707
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: helper
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].ports[0].containerPort
          value: 9707

  - it: should render both a classic and a native sidecar together, each in the right place
    set:
      deployment.sidecars:
        - name: classic-helper
          image: busybox
        - name: native-helper
          native: true
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: classic-helper
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: native-helper

  - it: should still support custom initContainers independently of native sidecars
    set:
      deployment.initContainers:
        - name: wait-for-it
          image: busybox
      deployment.sidecars:
        - name: helper
          native: true
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-it
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: helper
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
