nameOverride: ""

topLevelDomain: example.com
subDomain: internal
clusterName: k3s

deployment:
  create: true
  name: "{{ include \"service.name\" $ }}"
  podAnnotations: {}
  replicaCount: 1
  # runtimeClassName: nvidia
  progressDeadlineSeconds: 600
  # Pod-level security context (spec.securityContext). Applies to all containers.
  securityContext: {}
    # runAsNonRoot: true
    # supplementalGroups: [44, 109]
  container:
    image: "ghcr.io/org/repo:tag"
    imagePullPolicy: IfNotPresent
    hostNetwork: false
    dnsPolicy: ClusterFirst
    command: []
    args: []
    # Container-level security context (spec.containers[].securityContext).
    securityContext: {}
      # privileged: false
      # runAsUser: 5000
      # runAsGroup: 5000
    ports:
      - name: http
        containerPort: 8080
        protocol: TCP
    volumeMounts:
      - mountPath: /config
        name: config
    env:
      - name: PUID
        value: "5000"
      - name: PGID
        value: "5000"
      - name: TZ
        valueFrom:
          secretKeyRef:
            name: "{{ $.Release.Name }}"
            key: TZ
    startupProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 10
      failureThreshold: 30
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 5
      failureThreshold: 5
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 60
      failureThreshold: 5
      timeoutSeconds: 5
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    lifecycle: {}
  initContainers: []

ingress:
  create: true
  tls:
    mode: wildcard
  issuer:
    name: letsencrypt-staging-issuer
  labels:
    exposure: internal
  defaultRoute:
    externalDns:
      enabled: true
    extraMiddlewares: []
    #  - name: keycloak-openid
    #    namespace: traefik

databases: []
  # - name: "{{ $.Release.Name }}"
  #   owner: "{{ $.Release.Name }}-owner"
  #   targetClusterName: shared
  #   targetClusterNamespace: cnpg
  #   reclaimPolicy: retain

customMiddleware: {}
  # definitions:
  #   - apiVersion: traefik.io/v1alpha1
  #     kind: Middleware
  #     metadata:
  #       name: "{{ $.Release.Name }}-headers"
  #     spec:
  #       headers:
  #         customRequestHeaders:
  #           X-Forwarded-Proto: https

volumes:
  - name: config
    persistentVolumeClaim:
      claimName: config

persistentVolumeClaims:
  - name: config
    storageClassName: truenas-iscsi-csi-retained
    reclaimPolicy: Delete
    size: 1Gi
    annotations: {}

service:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http

job:
  enabled: false
  name: job-name
  env: []
    # - name: PUID
    #   value: "5000"
  command: []
  args: []
  annotations: {}
    # argocd.argoproj.io/hook: PreSync
    # argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

externalSecrets:
  - name: "{{ $.Release.Name }}"
    path: software/{{ $.Values.clusterName }}/{{ $.Release.Name }}
    refreshInterval: 300s

serviceAccount:
  create: false
  secret:
    create: false

clusterRole: {}
  # rules: []

clusterRoleBinding: {}
  # role: "{{ $.Release.Name }}"
  # serviceAccount:
  #   name: "{{ $.Release.Name }}"
  #   namespace: "{{ $.Release.Namespace }}"

configmaps: []

homepage:
  enabled: true
  name: "{{ $.Release.Name }}"
  icon: "{{ $.Release.Name }}"
  group: services
  weight: "10"

monitoring:
  serviceMonitor:
    create: false
    port: monitoring
    interval: 1m
    scrapeTimeout: 10s
  exportarr:
    create: false
    version: latest
    apiKeySecretName: "api_key"

extraDeployments: []

extraIngressRoutes: []
  # - name: "{{ include \"service.name\" . }}-external"
  #   labels:
  #     exposure: external
  #   match: "Host(`service.k3s.example.com`)"
  #   certificateHostname: "service.k3s.example.com"
  #   middlewares:
  #     - name: middleware-name
  #       namespace: traefik

extraObjects: []
