{{- with .Values.deployment -}}
{{- if .create -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ tpl .name $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ tpl .name $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  replicas: {{ .replicaCount }}
  progressDeadlineSeconds: {{ .progressDeadlineSeconds }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "service.labels" $ | nindent 8 }}
      {{- if or .podAnnotations $.Values.autoUpdate.enabled $.Values.monitoring.annotationDiscovery.create }}
      annotations:
        {{- with .podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "service.autoUpdateAnnotations" $ | nindent 8 }}
        {{- include "service.annotationDiscoveryAnnotations" $ | nindent 8 }}
      {{- end }}
    spec:
      {{- with .securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ include "service.name" $ }}
      automountServiceAccountToken: true
      {{- end }}
      {{- if .runtimeClassName }}
      runtimeClassName: {{ .runtimeClassName }}
      {{- end }}
      hostNetwork: {{ .container.hostNetwork }}
      dnsPolicy: {{ .container.dnsPolicy }}
      containers:
        - name: {{ include "service.name" $ }}
          image: {{ .container.image }}
          imagePullPolicy: {{ .container.imagePullPolicy }}
          {{- with .container.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .container.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .container.startupProbe }}
          startupProbe:
            {{- tpl (. | toYaml) $ | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- tpl (.container.livenessProbe | toYaml) $ | nindent 12 }}
          readinessProbe:
            {{- tpl (.container.readinessProbe | toYaml) $ | nindent 12 }}
          resources:
            {{- toYaml .container.resources | nindent 12 }}
          {{- with .container.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .container.env }}
          env:
            {{- tpl (. | toYaml) $ | nindent 12 }}
          {{- end }}
          {{- if .container.command }}
          command:
            {{- toYaml .container.command | nindent 12 }}
          {{- end }}
          {{- if .container.args }}
          args:
            {{- toYaml .container.args | nindent 12 }}
          {{- end }}
          {{- with .container.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- range .sidecars }}
        {{- if not .native }}
        {{- include "service.sidecarContainer" (dict "sidecar" . "root" $) | nindent 8 }}
        {{- end }}
        {{- end }}
      volumes:
        {{- tpl ($.Values.volumes | toYaml) $ | nindent 8 }}
      {{- $nativeSidecars := list }}
      {{- range .sidecars }}{{- if .native }}{{- $nativeSidecars = append $nativeSidecars . }}{{- end }}{{- end }}
      {{- if or (.initContainers) $nativeSidecars }}
      initContainers:
        {{- with .initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- range $nativeSidecars }}
        {{- include "service.sidecarContainer" (dict "sidecar" . "root" $) | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}

{{/*
Renders one entry from deployment.sidecars[] as a full container body
*/}}
{{- define "service.sidecarContainer" -}}
{{- $sidecar := .sidecar -}}
{{- $root := .root -}}
- name: {{ tpl $sidecar.name $root }}
  image: {{ $sidecar.image }}
  imagePullPolicy: {{ $sidecar.imagePullPolicy | default "IfNotPresent" }}
  {{- if $sidecar.native }}
  restartPolicy: Always
  {{- end }}
  {{- with $sidecar.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sidecar.ports }}
  ports:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sidecar.startupProbe }}
  startupProbe:
    {{- tpl (. | toYaml) $root | nindent 4 }}
  {{- end }}
  {{- with $sidecar.livenessProbe }}
  livenessProbe:
    {{- tpl (. | toYaml) $root | nindent 4 }}
  {{- end }}
  {{- with $sidecar.readinessProbe }}
  readinessProbe:
    {{- tpl (. | toYaml) $root | nindent 4 }}
  {{- end }}
  {{- with $sidecar.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sidecar.volumeMounts }}
  volumeMounts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sidecar.env }}
  env:
    {{- tpl (. | toYaml) $root | nindent 4 }}
  {{- end }}
  {{- if $sidecar.command }}
  command:
    {{- toYaml $sidecar.command | nindent 4 }}
  {{- end }}
  {{- if $sidecar.args }}
  args:
    {{- toYaml $sidecar.args | nindent 4 }}
  {{- end }}
  {{- with $sidecar.lifecycle }}
  lifecycle:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
